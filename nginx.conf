server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El enrutado es del lado del cliente: cualquier ruta desconocida
    # devuelve index.html en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
